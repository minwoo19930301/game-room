name: Deploy game room to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify game rules and rendering
        run: |
          npm test --workspaces --if-present
          node --test public/platformer/tests/*.test.mjs
      - name: Build all games and the catalog
        run: |
          npm run build
          python3 scripts/portal.py
          python3 scripts/check-assets.py
      - name: Stamp the deployed revision
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('public/release.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY']
          }) + '\n')
          Path('public/.nojekyll').touch()
          PY
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Check out the verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify the live revision and game URLs
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/verify-pages.py "$PAGES_URL" "$EXPECTED_SHA"
