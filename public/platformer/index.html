<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b28"><title>구름길 어드벤처</title><link rel="stylesheet" href="style.css?v=1"><script type="module" src="src/main.mjs?v=1"></script></head>
<body><main class="cabinet"><header class="toolbar"><a href="../">← 게임 모음</a><span>구름길 어드벤처</span><div><button id="sound" aria-pressed="false" aria-label="소리 켜기">소리 OFF</button><button id="pause" disabled aria-label="일시정지">Ⅱ</button></div></header><div class="screen"><canvas id="game" width="960" height="540" tabindex="0" aria-label="구름길 어드벤처 게임 화면. 방향키 이동, Space 점프, Shift 달리기와 불꽃."></canvas><section id="overlay" class="overlay"><div class="panel"><p class="eyebrow">ONE MORE ADVENTURE</p><h1>구름길<br>어드벤처</h1><p class="loading">세계를 준비하는 중…</p><button disabled>시작하기 →</button></div></section><div id="toast" aria-live="polite"></div></div><div class="touch-controls" aria-label="터치 조작"><div class="dpad"><button data-action="left" aria-label="왼쪽 이동">◀</button><button data-action="right" aria-label="오른쪽 이동">▶</button><button data-action="down" aria-label="웅크리기">▼</button></div><div class="actions"><button data-action="run" aria-label="달리기와 불꽃">B<small>달리기</small></button><button data-action="jump" aria-label="점프">A<small>점프</small></button></div></div><footer><span>← → 이동</span><span>SPACE / X 점프</span><span>SHIFT / Z 달리기 · 불꽃</span><span>↓ 웅크리기</span><button id="help">조작법</button></footer><p id="status" class="sr-only" aria-live="polite"></p></main></body></html>
