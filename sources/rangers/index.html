<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11343f" />
    
    <meta
      name="description"
      content="셔츠 전대 — 세 명의 블루셔츠가 지키는 도시. 독립 2D 태그 액션 게임."
    />
    <title>셔츠 전대 · Blue Shirt Rangers</title>
  </head>
  <body>
    <main id="cabinet" aria-label="셔츠 전대 게임">
      <canvas
        id="game"
        width="1280"
        height="720"
        tabindex="0"
        aria-label="셔츠 전대 전투 화면"
      ></canvas>
      <section id="overlay" aria-live="polite"></section>
      <nav id="utility" aria-label="게임 설정">
        <button id="sound" aria-pressed="false">소리 OFF</button>
        <button id="motion" aria-pressed="false">동작 줄이기</button>
        <button id="pause">일시정지 Esc</button>
      </nav>
      <section id="touch" aria-label="터치 조작">
        <div class="move-pad">
          <button data-key="ArrowLeft" aria-label="왼쪽 이동">◀</button
          ><button data-key="ArrowRight" aria-label="오른쪽 이동">▶</button>
        </div>
        <div class="action-pad">
          <button data-key="KeyV">방어</button
          ><button data-key="KeyC">교대</button
          ><button data-key="Space">점프</button
          ><button data-key="KeyX">특수</button
          ><button data-key="KeyZ">공격</button>
        </div>
      </section>
      <p id="status" class="sr-only" role="status"></p>
    </main>
    <script type="module" src="/src/main.mjs"></script>
  <a href="../index.html" style="position:fixed;left:8px;bottom:8px;z-index:9999;background:#10243e;color:white;padding:9px 12px;border-radius:10px;text-decoration:none">← 게임 모음</a></body>
</html>
